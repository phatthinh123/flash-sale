server:
  port: 8080
spring:
  application:
    name: gateway
  cloud:
    gateway:
      mvc:
        routes:
          - id: auth-service
            uri: ${AUTH_SERVICE_URL:http://localhost:8081}
            predicates:
              - Path=/api/v1/auth/**
          - id: flashsale-service
            uri: ${FLASHSALE_SERVICE_URL:http://localhost:8082}
            predicates:
              - Path=/api/v1/flash-sales/**
          - id: inventory-service
            uri: ${INVENTORY_SERVICE_URL:http://localhost:8083}
            predicates:
              - Path=/api/v1/inventory/**
